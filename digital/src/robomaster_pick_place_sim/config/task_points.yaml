grasp_cube_action:
  ros__parameters:
    # 取物体中心在 world 坐标系中的位置，单位为米。
    cube_x: 0.35
    cube_y: 0.0
    cube_z: 0.061

    # x 轴向前、y 轴向左；向右旋转约 30 度记为负角度。
    turn_angle_degrees: -30.0

    # 半径 0.35 m，每轮累计向右旋转约 30 度后的五个放置点。
    place_point_1: [0.303109, -0.175000, 0.061]
    place_point_2: [0.175000, -0.303109, 0.061]
    place_point_3: [0.000000, -0.350000, 0.061]
    place_point_4: [-0.175000, -0.303109, 0.061]
    place_point_5: [-0.303109, -0.175000, 0.061]

    # 实验要求安全高度小于 0.5 m；当前配置为 0.45 m。
    safe_height: 0.45
