# MoveIt 执行控制器配置 (官方标准结构, 顶层合并进 move_group 参数)
# 手臂通过 arm_controller 的 FollowJointTrajectory Action 执行轨迹
# 夹爪(gripper_controller)是 forward_command_controller, 没有 Action 接口,
# 由抓取节点直接向 /gripper_controller/commands 话题发送开合指令
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - base_yaw_joint
      - arm_lift_joint
      - wrist_pitch_joint
