initial: INITIALIZE
terminal: DONE
failure: SAFE_STOP
states:
  INITIALIZE: [WAIT_SCENE, SAFE_STOP]
  WAIT_SCENE: [ACQUIRE, SAFE_STOP]
  ACQUIRE: [ALIGN, DONE, SAFE_STOP]
  ALIGN: [APPROACH, RECORD, SAFE_STOP]
  APPROACH: [GRASP, SAFE_STOP]
  GRASP: [RETREAT, VERIFY, SAFE_STOP]
  RETREAT: [PLACE, SAFE_STOP]
  PLACE: [VERIFY, SAFE_STOP]
  VERIFY: [RETURN_HOME, SAFE_STOP]
  RETURN_HOME: [RECORD, SAFE_STOP]
  RECORD: [ACQUIRE, DONE, SAFE_STOP]
  SAFE_STOP: [DONE]
  DONE: []
